name: Demo risk checks
on:
  push:
    branches:
      - safety/risk-gate-manual-orders
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Risk regression tests
        run: bun run test
      - name: Production build
        run: bun run build
