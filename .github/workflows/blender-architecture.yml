name: Blender architecture model
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/blender/**'
      - '.github/workflows/blender-architecture.yml'
permissions:
  contents: read
jobs:
  build-architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender
          blender --version
      - name: Generate architectural model
        run: blender --background --python tools/blender/build_architecture.py
      - name: Upload 3D model and render
        uses: actions/upload-artifact@v4
        with:
          name: signal-symphony-architecture
          path: blender-output/
          if-no-files-found: error
          retention-days: 30
