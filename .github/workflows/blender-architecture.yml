name: Blender architecture model
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/blender/**'
      - '.github/workflows/blender-architecture.yml'
permissions:
  contents: read
jobs:
  build-architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy libegl1 libgl1 libopengl0 libxrender1 libxi6 libxkbcommon0 libsm6 libxext6 libx11-6 xvfb mesa-utils
          blender --version
          blender --background --python-expr "import numpy; print('NumPy available:', numpy.__version__)"
      - name: Generate architectural model
        shell: bash
        run: |
          set -euo pipefail
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a blender --background --python-exit-code 1 --python tools/blender/build_architecture.py 2>&1 | tee blender-build.log
          test -s blender-output/signal_symphony_architecture.blend
          test -s blender-output/signal_symphony_architecture.glb
          test -s blender-output/architecture.png
      - name: Generate optional furnished preview
        shell: bash
        run: |
          set -euo pipefail
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a blender --background --python-exit-code 1 --python tools/blender/furnish_architecture.py 2>&1 | tee blender-furniture.log
          test -s blender-output/signal_symphony_furnished.blend
          test -s blender-output/signal_symphony_furnished.glb
          test -s blender-output/architecture_furnished.png
      - name: Generate optional staffed preview
        shell: bash
        run: |
          set -euo pipefail
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a blender --background --python-exit-code 1 --python tools/blender/agents_architecture.py 2>&1 | tee blender-agents.log
          test -s blender-output/signal_symphony_agents.blend
          test -s blender-output/signal_symphony_agents.glb
          test -s blender-output/architecture_agents.png
      - name: Upload diagnostic logs if generation fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: blender-diagnostic-log
          path: |
            blender-build.log
            blender-furniture.log
            blender-agents.log
          if-no-files-found: warn
      - name: Upload 3D models and renders
        uses: actions/upload-artifact@v4
        with:
          name: signal-symphony-architecture
          path: blender-output/
          if-no-files-found: error
          retention-days: 30
