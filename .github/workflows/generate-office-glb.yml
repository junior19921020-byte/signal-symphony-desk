name: Generate Blender office GLB

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/build_office_blender.py"
      - ".github/workflows/generate-office-glb.yml"

permissions:
  contents: write

jobs:
  export-office:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Restore cached Blender
        id: blender-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/signal-blender
          key: signal-blender-4.2.0-linux-x64-v1
      - name: Download Blender binary if cache is empty
        if: steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/signal-blender"
          curl --fail --location --retry 3 --retry-delay 5 --connect-timeout 20 --max-time 600 \
            https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz \
            -o /tmp/blender.tar.xz
          tar -xJf /tmp/blender.tar.xz -C "$HOME/.cache/signal-blender" --strip-components=1
          test -x "$HOME/.cache/signal-blender/blender"
      - name: Configure Blender
        run: |
          echo "$HOME/.cache/signal-blender" >> "$GITHUB_PATH"
          "$HOME/.cache/signal-blender/blender" --background --factory-startup --python-expr "import numpy; print('Blender NumPy:', numpy.__version__)"
      - name: Export office scene to GLB
        run: |
          mkdir -p build/office
          blender --background --factory-startup --python scripts/build_office_blender.py -- --output build/office/signal-office.glb
          test -s build/office/signal-office.glb
      - name: Validate GLB header and size
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct
          p = Path("build/office/signal-office.glb")
          data = p.read_bytes()
          assert data[:4] == b"glTF", "Invalid GLB magic"
          version, length = struct.unpack_from("<II", data, 4)
          assert version == 2, f"Unsupported glTF version {version}"
          assert length == len(data), "GLB file length mismatch"
          assert len(data) > 1024, "GLB unexpectedly small"
          print(f"GLB validated: {len(data):,} bytes")
          PY
      - name: Upload downloadable model artifact
        uses: actions/upload-artifact@v4
        with:
          name: signal-office-blender-glb
          path: build/office/signal-office.glb
          if-no-files-found: error
          retention-days: 30
      - name: Publish current GLB to app static assets
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          set -euo pipefail
          mkdir -p public/models
          cp build/office/signal-office.glb public/models/signal-office.glb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/models/signal-office.glb
          if git diff --cached --quiet; then
            echo "No GLB changes to publish"
            exit 0
          fi
          git commit -m "chore: update generated office GLB [skip ci]"
          git push origin HEAD:main
